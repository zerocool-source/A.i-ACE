<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD ZONE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23120606'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23d32f2f' font-family='monospace' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060608; }
      canvas { display: block; cursor: crosshair; }
      /* RCAS-style sharpen applied when the canvas renders below output
         resolution — a 3x3 unsharp convolution on the composited image */
      .upscale-sharpen { filter: url(#dz-sharpen); }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="dz-sharpen">
        <feConvolveMatrix order="3" preserveAlpha="true"
          kernelMatrix="0 -0.25 0  -0.25 2 -0.25  0 -0.25 0" />
      </filter>
    </svg>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
